name: Homebrew cask

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cask-tap
  cancel-in-progress: false

jobs:
  cask:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      TAG: "${{ github.event.release.tag_name }}"
      PRERELEASE: "${{ github.event.release.prerelease }}"
      WORK_DIR: "${{ github.workspace }}/../cask-work"
      TAP_DIR: "${{ github.workspace }}/../homebrew-tap"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Clone public tap
        run: sh tools/update-tap.sh clone
      - name: Prepare tap update
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/update-tap.sh prepare
      - name: Push tap update
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: sh tools/update-tap.sh push
