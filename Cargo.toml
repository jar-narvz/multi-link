[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }
clap = { version = "4.5.50", features = ["derive"] }
tempfile = "3.23.0"
multi-link-model = { path = "crates/model" }
